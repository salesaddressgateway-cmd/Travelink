<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 65" width="100%" height="100%">
  <defs>
    <!-- Sunset Gold Gradients -->
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E76F51" />
      <stop offset="50%" stop-color="#F4A261" />
      <stop offset="100%" stop-color="#E9C46A" />
    </linearGradient>

    <linearGradient id="pinGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3D2B1F" />
      <stop offset="100%" stop-color="#E76F51" />
    </linearGradient>

    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#E76F51" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Logo Mark / Emblem Group -->
  <g transform="translate(10, 5)" filter="url(#logoGlow)">
    <!-- Outer Globe Ring -->
    <circle cx="28" cy="28" r="24" fill="none" stroke="url(#logoGradient)" stroke-width="3" stroke-dasharray="4 2" />
    
    <!-- Connection Arc -->
    <path d="M 12,28 A 16,16 0 0,1 44,28" fill="none" stroke="#F4A261" stroke-width="2" stroke-linecap="round"/>

    <!-- Stylized Location Pin / Compass Needle -->
    <path d="M 28,8 C 21,8 16,13.5 16,20.5 C 16,29.5 28,44 28,44 C 28,44 40,29.5 40,20.5 C 40,13.5 35,8 28,8 Z" fill="url(#logoGradient)" />
    
    <!-- Inner Compass Core -->
    <circle cx="28" cy="20.5" r="5" fill="#FFF8EC" />
    <path d="M 28,17.5 L 30,20.5 L 28,23.5 L 26,20.5 Z" fill="#3D2B1F" />
  </g>

  <!-- Typography Group -->
  <g transform="translate(72, 12)">
    <!-- Main Brand Name -->
    <text x="0" y="28" font-family="'Poppins', 'Inter', system-ui, sans-serif" font-weight="800" font-size="26" fill="url(#logoGradient)" letter-spacing="-0.5">
      Travelink
    </text>
    
    <!-- Tagline -->
    <text x="1" y="44" font-family="'Inter', system-ui, sans-serif" font-weight="600" font-size="9" fill="#3D2B1F" letter-spacing="1.5" opacity="0.85">
      WHERE JOURNEYS CONNECT
    </text>
  </g>
</svg>
